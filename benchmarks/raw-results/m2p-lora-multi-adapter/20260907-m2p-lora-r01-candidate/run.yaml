  roles: [npc-merchant, npc-guard, quest-planner, lore-archivist]
  dataset:
    source: raw/datasets
    synthetic: true
    seed: 42
    per_role: {train: 96, eval: 24}
    template_families: {train: 12, eval: 2}
    evaluation_groups: {development: "000..011", held_out: "012..023"}
  training:
    max_steps: 80  # 四个 <role>-s080 attempt，分别从 base 开始。
    learning_rate: 0.0001
    logged_lr_schedule: linear_decay
    seed: 42
    lora: {r: 8, alpha: 16, dropout: 0.05, bias: none, task_type: CAUSAL_LM}
    target_modules: [q_proj, k_proj, v_proj, o_proj]
    # 以下固定项取自 lora_train.py；未独立保存完整 TrainingArguments 快照。
    replay_fixed: {per_device_train_batch_size: 1, gradient_accumulation_steps: 8, bf16: true, weight_decay: 0.0, gradient_checkpointing: true, max_length: 512, loss: completion_only}
    sources: [raw/training, raw/adapters]
  evaluation:
    peft: {cases_per_role: 12, case_indices: "000..011"}
    single: {requests_per_role: 1}
    multi_individual: {requests_per_role: 1, concurrency: 1}
    multi_mixed: {requests: 16, concurrency: 4, order: round_robin}
    behavior: {adapter_requests: 96, base_requests: 24, concurrency: 1, base_model: qwen3-8b, base_cases: npc-merchant.eval.jsonl}
