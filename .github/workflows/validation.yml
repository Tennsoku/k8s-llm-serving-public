name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: serving/vllm/benchmark/requirements-benchmark.txt

      - name: Install test tools
        run: |
          python -m pip install \
            --requirement serving/vllm/benchmark/requirements-benchmark.txt \
            "pytest>=8,<10" \
            "ruff>=0.12,<1"

      - name: Test
        run: python -m pytest -q serving/vllm/tests/

      - name: Ruff
        run: git ls-files -z '*.py' | xargs -0 ruff check --select E9,F63,F7,F82

      - name: ShellCheck
        run: |
          shellcheck --shell=bash --severity=warning \
            scripts/check-repo-hygiene.sh \
            scripts/experiments/*.sh \
            serving/vllm/*.sh

      - name: Enforce repository hygiene
        run: scripts/check-repo-hygiene.sh

      - name: Validate tracked benchmark configs
        shell: bash
        run: |
          while IFS= read -r config; do
            python serving/vllm/benchmark/benchmark_config.py \
              --config "$config" validate
          done < <(git ls-files -- 'benchmarks/configs/*.yaml')
