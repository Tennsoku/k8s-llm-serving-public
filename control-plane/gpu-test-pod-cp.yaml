apiVersion: v1
kind: Pod
metadata:
  name: gpu-matmul-test-spark-4151
  labels:
    app: cuda
spec:
  runtimeClassName: nvidia
  restartPolicy: Never

  nodeSelector:
    kubernetes.io/hostname: spark-4151

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  containers:
    - name: pytorch
      image: nvcr.io/nvidia/pytorch@sha256:7531d90bcbe0e43e1f7363029c7e145ce90eebeb494a7b4695fdba0329d7c3c3
      command: ["python3", "-c"]
      args:
        - |
          import json
          import torch

          if not torch.cuda.is_available():
              raise SystemExit("CUDA unavailable")

          a = torch.randn((2048, 2048), device="cuda", dtype=torch.float16)
          b = torch.randn((2048, 2048), device="cuda", dtype=torch.float16)
          c = a @ b
          torch.cuda.synchronize()

          result_finite = bool(torch.isfinite(c).all().item())
          print(json.dumps({
              "torch": torch.__version__,
              "cuda_runtime": torch.version.cuda,
              "device": torch.cuda.get_device_name(0),
              "matmul_shape": list(c.shape),
              "result_finite": result_finite
          }, indent=2))

          if not result_finite:
              raise SystemExit("non-finite CUDA result")
      resources:
        requests:
          nvidia.com/gpu: 1
        limits:
          nvidia.com/gpu: 1
